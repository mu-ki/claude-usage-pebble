name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Targets and archs come from the "build" config in package.json.
          # Naming a target here (e.g. "--mac dmg") would override its arch
          # with the runner's own, so the mac build would be arm64 only.
          - os: windows-latest
            args: --win
            files: dist/*.exe
          - os: macos-latest
            args: --mac
            files: dist/*.dmg
          - os: ubuntu-latest
            args: --linux
            files: dist/*.AppImage

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Unsigned builds: no signing secrets, and don't let macOS look for a
        # signing identity in the keychain.
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign build provenance attestations
      attestations: write  # store them on GitHub
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: build-*
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum *.exe *.dmg *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Claude Usage Pebble ${{ github.ref_name }}
          generate_release_notes: true
          # Tags like v1.0.0-beta are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/SHA256SUMS.txt
