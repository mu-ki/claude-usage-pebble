<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Gallery</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #3f4652; color: #f0f0ee; font: 14px/1.4 "Segoe UI", -apple-system, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0 0 20px; color: #c9cdd4; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 14px; }
  .item { background: #2f3540; border-radius: 10px; padding: 10px; }
  .item b { display: block; margin-bottom: 8px; }
  .pair { display: flex; flex-direction: column; gap: 4px; }
  iframe { border: 0; width: 100%; height: 400px; background: transparent; } iframe.c { height: 140px; }
  .pair div { flex: 1; min-width: 0; font-size: 11px; color: #9aa1ab; }
</style>
</head>
<body>
<h1>Claude Usage Pebble: layouts</h1>
<p>Sample data. Each layout collapsed (top) and expanded (below). Switch layouts in the app with right-click → Layout.</p>
<div class="grid" id="grid"></div>
<script>
  const names = { pill: 'Classic bar', dot: 'Tiny dot', critter: 'Hanging critter', rings: 'Rings', battery: 'Battery', terminal: 'Terminal' };
  document.getElementById('grid').innerHTML = Object.entries(names).map(([id, n]) => `
    <div class="item"><b>${n}</b><div class="pair">
      <div>collapsed<iframe class="c" src="../widget.html?layout=${id}"></iframe></div>
      <div>expanded<iframe src="../widget.html?layout=${id}&open"></iframe></div>
    </div></div>`).join('');
</script>
</body>
</html>
