<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Claude Usage Pebble</title>
<style>
  :root {
    --bg: #1f1f1e; --line: #323230; --fg: #f0f0ee; --dim: #a0a09b; --soft: #2b2b2a;
    --track: #1a2d48; --blue: #3b82f6; --amber: #f59e0b; --red: #ef4444; --accent: #d97757;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px/1.3 "Segoe UI", -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, sans-serif; color: var(--fg); }
  #root { position: absolute; left: 0; top: 0; width: max-content; }
  button { all: unset; cursor: pointer; color: var(--dim); }
  button:hover { color: var(--fg); }
  [data-toggle] { cursor: pointer; }
  .card { background: var(--bg); border-radius: 12px; overflow: hidden; }
  .panel { animation: drop .18s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }

  /* shared usage list */
  .list { padding: 8px 12px 8px; }
  .row { padding: 6px 0 8px; }
  .row .top { display: flex; justify-content: space-between; gap: 12px; }
  .row .pct, .row .sub, .msg { color: var(--dim); }
  .row .sub { font-size: 11.5px; margin-top: 1px; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .foot { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; padding-top: 4px; }
  .msg { padding: 6px 0; }
  .msg button { color: var(--accent); }

  /* 1. Classic bar */
  .pill { width: 300px; }
  .pill .tab { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .pill .sum { margin-left: auto; color: var(--dim); font-size: 11.5px; white-space: nowrap; }
  .pill .list { border-top: 1px solid var(--line); margin: 0 12px; padding: 8px 0; }

  /* 2. Tiny dot */
  .dotwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
         background: conic-gradient(var(--c) var(--p), var(--soft) 0); }
  .dot > div { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
  .dotwrap .card { width: 250px; }

  /* 3. Hanging critter */
  .critter { display: flex; flex-direction: column; align-items: center; }
  .critter .buddy { width: 84px; transform-origin: 50% 0; animation: swing 2.8s ease-in-out infinite alternate; }
  .critter .buddy:hover, .critter.open .buddy { animation-play-state: paused; }
  .critter.open .buddy { animation: none; }
  @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .critter .sign { width: 250px; position: relative; margin-top: 14px; overflow: visible; }
  .critter .sign::before, .critter .sign::after { content: ""; position: absolute; top: -14px; width: 1px; height: 14px; background: #8a8a85; }
  .critter .sign::before { left: 30%; } .critter .sign::after { right: 30%; }

  /* 4. Rings */
  .rings { padding: 10px 12px 8px; }
  .rings.open { width: 270px; }
  .ringrow { display: flex; justify-content: center; gap: 14px; }
  .ring { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; color: var(--dim); }
  .ring svg text { font: 600 11px/1 "Segoe UI", -apple-system, sans-serif; fill: var(--fg); }
  .rings .list { padding: 6px 0 0; margin-top: 8px; border-top: 1px solid var(--line); }
  .ringmsg { display: flex; gap: 8px; align-items: center; color: var(--dim); padding: 2px 4px; }

  /* 5. Battery */
  .batt .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .cell { position: relative; width: 58px; height: 22px; border: 2px solid #5b5b57; border-radius: 6px; padding: 2px; }
  .cell::after { content: ""; position: absolute; right: -6px; top: 6px; width: 3px; height: 7px; border-radius: 0 2px 2px 0; background: #5b5b57; }
  .cell i { display: block; height: 100%; border-radius: 3px; }
  .cell span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 600; text-shadow: 0 0 3px #000; }
  .batt .lbl { color: var(--dim); font-size: 11px; }
  .batt.open { width: 260px; }
  .batt .list { border-top: 1px solid var(--line); margin: 0 12px; padding: 8px 0; }

  /* 6. Terminal */
  .term { background: #0d1117; color: #7ee787; font: 12px/1.5 var(--mono); border: 1px solid #30363d; border-radius: 8px; padding: 5px 10px; }
  .term .dimt { color: #6e7681; } .term .warn { color: #e3b341; } .term .hot { color: #ff7b72; }
  .term .lines { margin-top: 4px; padding-top: 4px; border-top: 1px dashed #30363d; white-space: pre; }
  .term button { color: #6e7681; font: inherit; } .term button:hover { color: #7ee787; }

  /* Every layout sits in a wrapper that lines things up against its screen edge (its "dock"):
     top and bottom widgets are centered, side ones hug their edge, and bottom ones stack upward. */
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .wrap.bottom { flex-direction: column-reverse; }
  .wrap.right { align-items: flex-end; }
  .wrap.left { align-items: flex-start; }

  /* Characters: an SVG toy plus the usual details card */
  .char { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .char.bottom { flex-direction: column-reverse; }
  .char.right { align-items: flex-end; }
  .char.left { align-items: flex-start; }
  .char .panel { width: 250px; }
  .toy { display: block; overflow: hidden; }

  /* Idle animations. Every period divides 5.6s, so a 5.6s recording loops seamlessly. */
  .sway { transform-origin: 50% 0; animation: sway 5.6s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bob { animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .peek { animation: peek 5.6s ease-in-out infinite; }
  @keyframes peek { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-5px); } }
  .wave { transform-box: fill-box; transform-origin: 50% 0; animation: wave 2.8s ease-in-out infinite; }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
  .armwave { transform-box: fill-box; transform-origin: 0 100%; animation: armwave 1.4s ease-in-out infinite; }
  @keyframes armwave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-22deg); } }
  .blink { animation: blink 2.8s steps(1) infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .flicker { animation: blink 1.4s steps(2) infinite; }
  .wobble { transform-origin: 50% 100%; animation: wobble 5.6s ease-in-out infinite; }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } }
  .swim { transform-box: fill-box; transform-origin: center; animation: swim 5.6s linear infinite; }
  @keyframes swim {
    0% { transform: translateX(0) scaleX(1); } 24.9% { transform: translateX(16px) scaleX(1); }
    25% { transform: translateX(16px) scaleX(-1); } 74.9% { transform: translateX(-16px) scaleX(-1); }
    75% { transform: translateX(-16px) scaleX(1); } 100% { transform: translateX(0) scaleX(1); }
  }
  .rise { animation: rise 2.8s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateY(-22px); opacity: 0; } }

  /* Usage alert: a speech bubble that pops up at 80%, 90% and 100%, while the widget nudges for attention */
  .bubble { position: relative; width: 236px; padding: 10px 12px; border-radius: 12px; background: #fff7e8; color: #2a1a14;
            box-shadow: 0 4px 14px rgba(0,0,0,.35); font-size: 12.5px; animation: pop .25s ease-out; transform-origin: 50% 0; }
  .bubble::before { content: ""; position: absolute; top: -6px; left: calc(50% - 6px); width: 12px; height: 12px; background: inherit; transform: rotate(45deg); }
  .wrap.bottom .bubble { transform-origin: 50% 100%; }
  .wrap.bottom .bubble::before { top: auto; bottom: -6px; }
  .wrap.right .bubble::before { left: auto; right: 26px; }
  .wrap.left .bubble::before { left: 26px; }
  .bubble.lvl90 { background: #ffe8d4; }
  .bubble.lvl100 { background: #ffe0de; }
  .bubble .bs { color: #7a6a5e; font-size: 11.5px; margin-top: 2px; }
  .bubble .ba { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 8px; }
  .bubble button { color: #7a6a5e; font-size: 12px; }
  .bubble button:hover { color: #2a1a14; }
  .bubble button.primary { background: var(--accent); color: #fff; padding: 3px 12px; border-radius: 999px; font-weight: 600; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  .alerting [data-toggle] { animation: nudge 1.4s ease-in-out infinite; transform-origin: 50% 0; }
  .wrap.bottom.alerting [data-toggle] { transform-origin: 50% 100%; }
  @keyframes nudge {
    0%, 30%, 100% { transform: none; } 6% { transform: translateY(-3px) rotate(-3deg); }
    12% { transform: translateY(0) rotate(3deg); } 18% { transform: translateY(-2px) rotate(-2deg); } 24% { transform: rotate(1deg); }
  }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Demo mode: opening this file in a normal browser (no Electron bridge) shows sample data.
  // Pick a layout with ?layout=<id> (see `layouts` below), add &open to expand it, &alert to show
  // usage alerts, and &pct=session,week,fable to set the sample percentages (default 34,61,82).
  if (!window.widget) {
    const q = new URLSearchParams(location.search), soon = (h) => new Date(Date.now() + h * 3600e3).toISOString();
    const [s, w, f] = (q.get('pct') || '34,61,82').split(',').map(Number);
    window.widget = {
      demo: true,
      onConfig: (cb) => cb({ layout: q.get('layout') || 'pill', open: q.has('open'), alerts: q.has('alert') }),
      onState: (cb) => setTimeout(() => cb({ status: 'ok', updated: Date.now(), bars: [
        { label: 'Current session', pct: s, resetsAt: soon(3) },
        { label: 'This week', pct: w, resetsAt: soon(90) },
        { label: 'Fable this week', pct: f, resetsAt: soon(90) }] }), 100),
      setSize: (w, h) => { document.title = w + 'x' + h; },
      move() {}, moved() {}, refresh() {}, login() {}, menu() {},
    };
  }

  const root = document.getElementById('root');
  let state = { status: 'loading', bars: [] }, layout = 'pill', open = false, alertsOn = true;

  // Which screen edge each layout belongs to. Anything not listed hangs from the top.
  const DOCK = { cat: 'right', octopus: 'right', ghost: 'left', cactus: 'bottom', robot: 'bottom', fishbowl: 'bottom' };
  const dockOf = (id) => DOCK[id] || 'top';

  // ---------- helpers ----------
  const bars = () => state.bars || [];
  const r = (n) => Math.round(n);
  const clamp = (n) => Math.min(100, Math.max(0, n));
  const color = (p) => p >= 90 ? 'var(--red)' : p >= 75 ? 'var(--amber)' : 'var(--blue)';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const time = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const short = (b, i) => i === 0 ? 'Session' : i === 1 ? 'Week' : b.label.split(' ')[0];
  const login = () => state.status === 'login';

  function resetText(b, compact) {
    if (b.sub) return compact ? b.sub.replace(/^Resets\s*/i, '') : b.sub;
    if (!b.resetsAt) return '';
    const d = new Date(b.resetsAt), today = d.toDateString() === new Date().toDateString();
    const when = today ? time(d) : d.toLocaleDateString([], { weekday: compact ? 'short' : 'long' }) + ' ' + time(d);
    return compact ? when : 'Resets ' + (today ? 'at ' : '') + when;
  }

  function summary() {
    const b = bars();
    if (login()) return 'Click to sign in';
    if (b.length >= 2) return `Session ${r(b[0].pct)}%  ·  Week ${r(b[1].pct)}%`;
    return state.status === 'error' ? 'Error' : 'Loading…';
  }

  function spark(size, col) {
    let lines = '';
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5, len = i % 2 ? 5.5 : 7;
      lines += `<line x1="${Math.cos(a) * 1.5}" y1="${Math.sin(a) * 1.5}" x2="${Math.cos(a) * len}" y2="${Math.sin(a) * len}"/>`;
    }
    return `<svg width="${size}" height="${size}" viewBox="-8 -8 16 16" aria-hidden="true"><g stroke="${col || 'var(--accent)'}" stroke-width="1.8" stroke-linecap="round">${lines}</g></svg>`;
  }

  function foot() {
    const left = state.status === 'error' ? esc(state.message) : state.updated ? 'Updated ' + time(new Date(state.updated)) : '';
    return `<div class="foot"><span>${left}</span><button data-act="refresh">↻ Refresh</button></div>`;
  }

  // The expanded usage list most layouts share.
  function list() {
    if (login()) return `<div class="list"><div class="msg">Not signed in. <button data-act="login">Sign in to claude.ai</button></div></div>`;
    const rows = bars().map((x) => `
      <div class="row">
        <div class="top"><span>${esc(x.label)}</span><span class="pct">${r(x.pct)}% used</span></div>
        <div class="sub">${esc(resetText(x))}</div>
        <div class="bar"><i style="width:${clamp(x.pct)}%;background:${color(x.pct)}"></i></div>
      </div>`).join('');
    return `<div class="list">${rows || `<div class="msg">${state.status === 'error' ? esc(state.message) : 'Loading…'}</div>`}${foot()}</div>`;
  }

  // ---------- character helpers ----------
  const INK = '#2a1a14';
  const f = (n) => +n.toFixed(2);
  const worst = () => bars().reduce((m, x) => Math.max(m, x.pct), 0);
  const mood = () => login() ? 'sleep' : worst() >= 80 ? 'worried' : worst() >= 50 ? 'meh' : 'happy';
  const isDark = (c) => parseInt(c.slice(1, 3), 16) < 0x80;
  const sessionText = () => login() ? 'sign in' : bars()[0] ? r(bars()[0].pct) + '%' : '…';

  // Eyes, mouth, cheeks and (when worried) a sweat drop, centered on (x, y) at scale s.
  function face(x, y, s = 1, ink = INK, blush = '#f2a58c') {
    const m = mood(), e = 5 * s;
    const eyes = m === 'sleep'
      ? `<path d="M${f(x - e - 2 * s)} ${y} h${f(4 * s)} M${f(x + e - 2 * s)} ${y} h${f(4 * s)}" stroke="${ink}" stroke-width="${f(1.6 * s)}" stroke-linecap="round"/>`
      : `<circle cx="${f(x - e)}" cy="${y}" r="${f(2.6 * s)}" fill="${ink}"/><circle cx="${f(x + e)}" cy="${y}" r="${f(2.6 * s)}" fill="${ink}"/>` +
        (isDark(ink) ? `<circle cx="${f(x - e + 0.9 * s)}" cy="${f(y - 0.9 * s)}" r="${f(0.85 * s)}" fill="#fff"/><circle cx="${f(x + e + 0.9 * s)}" cy="${f(y - 0.9 * s)}" r="${f(0.85 * s)}" fill="#fff"/>` : '');
    const my = y + 6 * s, w = 7 * s;
    const mouth = m === 'sleep' ? `<circle cx="${x}" cy="${f(my + s)}" r="${f(1.3 * s)}" fill="${ink}"/>`
      : `<path d="${m === 'happy' ? `M${f(x - w / 2)} ${f(my - s)} q${f(w / 2)} ${f(4 * s)} ${f(w)} 0`
          : m === 'meh' ? `M${f(x - w / 2.4)} ${f(my + 0.5 * s)} h${f(w / 1.2)}`
          : `M${f(x - w / 2)} ${f(my + 2.5 * s)} q${f(w / 2)} ${f(-4 * s)} ${f(w)} 0`}" stroke="${ink}" stroke-width="${f(1.8 * s)}" fill="none" stroke-linecap="round"/>`;
    const cheeks = blush ? [-1, 1].map((d) => `<ellipse cx="${f(x + d * 8.5 * s)}" cy="${f(y + 3.5 * s)}" rx="${f(2.8 * s)}" ry="${f(1.6 * s)}" fill="${blush}" opacity=".6"/>`).join('') : '';
    const sweat = m === 'worried' ? `<path d="M${f(x + 11 * s)} ${f(y - 8 * s)} q${f(2.5 * s)} ${f(4 * s)} 0 ${f(6 * s)} q${f(-2.5 * s)} ${f(-2 * s)} 0 ${f(-6 * s)}z" fill="#7cc4ff"/>` : '';
    return cheeks + eyes + mouth + sweat;
  }

  // Small dark pill with the session percentage.
  function tag(cx, y) {
    const w = login() ? 40 : 34;
    return `<rect x="${cx - w / 2}" y="${y}" width="${w}" height="14" rx="7" fill="var(--bg)"/>` +
      `<text x="${cx}" y="${y + 10}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--fg)" font-family="Segoe UI, sans-serif">${sessionText()}</text>`;
  }

  // A clickable character drawing, and the layout around it (details card opens next to it).
  const toy = (w, h, body) => `<svg class="toy" data-toggle width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="${esc(summary())}"><title>${esc(summary())}</title>${body}</svg>`;
  const character = (svg) => `<div class="char ${dockOf(layout)} ${open ? 'open' : ''}">${svg}${open ? `<div class="card panel">${list()}</div>` : ''}</div>`;

  // ---------- usage alerts ----------
  // When a limit reaches 80%, 90% or 100%, a speech bubble pops up next to the widget. "Got it"
  // silences that level for that limit until it resets; the next level still alerts.
  const LEVELS = [[100, 'Limit reached'], [90, 'Almost out!'], [80, 'Heads up!']];
  const STORE = 'pebble.dismissedAlerts';
  let dismissed = [];
  try { if (!window.widget.demo) dismissed = JSON.parse(localStorage.getItem(STORE) || '[]'); } catch {}

  function currentAlert() {
    if (!alertsOn || login()) return null;
    let best = null;
    for (const b of bars()) {
      const lv = LEVELS.find(([t]) => b.pct >= t);
      if (!lv) continue;
      const key = `${b.label}|${lv[0]}|${b.resetsAt || b.sub || ''}`;
      if (dismissed.includes(key)) continue;
      if (!best || lv[0] > best.level || (lv[0] === best.level && b.pct > best.bar.pct)) best = { level: lv[0], title: lv[1], bar: b, key };
    }
    return best;
  }

  function bubble(a) {
    const b = a.bar, reset = resetText(b);
    const text = a.level >= 100 ? `${esc(b.label)} is used up.` : `${esc(b.label)} is at <b>${r(b.pct)}%</b>.`;
    return `<div class="bubble lvl${a.level}" role="alert"><div><b>${a.title}</b> ${text}</div>${reset ? `<div class="bs">${esc(reset)}</div>` : ''}` +
      `<div class="ba"><button data-act="details">Details</button><button data-act="dismiss" class="primary">Got it</button></div></div>`;
  }

  function dismissAlert() {
    const a = currentAlert();
    if (!a) return;
    dismissed = [...dismissed, a.key].slice(-60);
    try { if (!window.widget.demo) localStorage.setItem(STORE, JSON.stringify(dismissed)); } catch {}
  }

  // ---------- layouts ----------
  const layouts = {
    // 1. Classic bar: a slim tab with a pull-down drawer.
    pill: () => `
      <div class="card pill">
        <div class="tab" data-toggle>${spark(16)}<b>Claude</b><span class="sum">${summary()} ${login() ? '' : open ? '▴' : '▾'}</span></div>
        ${open ? `<div class="panel">${list()}</div>` : ''}
      </div>`,

    // 2. Tiny dot: a 30px ring that fills with session usage.
    dot: () => {
      const s = bars()[0], p = s ? clamp(s.pct) : 0;
      return `
        <div class="dotwrap">
          <div class="dot" data-toggle title="${esc(summary())}" style="--p:${p}%;--c:${s ? color(s.pct) : 'var(--soft)'}"><div>${spark(13)}</div></div>
          ${open ? `<div class="card panel">${list()}</div>` : ''}
        </div>`;
    },

    // 3. Hanging critter: dangles from a thread, drops lower as the week fills up, and its face shows how worried to be.
    critter: () => {
      const b = bars(), week = b[1] ? clamp(b[1].pct) : 0;
      const worst = b.reduce((m, x) => Math.max(m, x.pct), 0);
      const T = 14 + Math.round(week * 0.4), cy = T + 24;
      const mouth = login() ? `<circle cx="42" cy="${cy + 7}" r="2" fill="#2a1a14"/>`
        : worst >= 80 ? `<path d="M36 ${cy + 9} q6 -6 12 0" stroke="#2a1a14" stroke-width="2" fill="none" stroke-linecap="round"/>`
        : worst >= 50 ? `<path d="M37 ${cy + 7} h10" stroke="#2a1a14" stroke-width="2" stroke-linecap="round"/>`
        : `<path d="M36 ${cy + 5} q6 6 12 0" stroke="#2a1a14" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      const sweat = worst >= 80 ? `<path d="M62 ${cy - 12} q3 5 0 7 q-3 -2 0 -7z" fill="#7cc4ff"/>` : '';
      const legs = [-1, 1].map((d) => [[-8, 0], [4, 6]].map(([y, k]) =>
        `<path d="M${42 + d * 20} ${cy + y} q${d * 8} ${-4 + k} ${d * 12} ${4 + k}" stroke="#b85f43" stroke-width="2.4" fill="none" stroke-linecap="round"/>`).join('')).join('');
      const tag = login() ? 'sign in' : b[0] ? r(b[0].pct) + '%' : '…';
      return `
        <div class="critter ${open ? 'open' : ''}">
          <svg class="buddy" data-toggle viewBox="0 0 84 ${cy + 40}" height="${cy + 40}" aria-label="${esc(summary())}">
            <title>${esc(summary())}</title>
            <line x1="42" y1="0" x2="42" y2="${cy - 20}" stroke="#8a8a85" stroke-width="1.2"/>
            ${legs}
            <ellipse cx="42" cy="${cy}" rx="22" ry="20" fill="var(--accent)"/>
            <circle cx="35" cy="${cy - 4}" r="2.8" fill="#2a1a14"/><circle cx="49" cy="${cy - 4}" r="2.8" fill="#2a1a14"/>
            <circle cx="36" cy="${cy - 5}" r="0.9" fill="#fff"/><circle cx="50" cy="${cy - 5}" r="0.9" fill="#fff"/>
            <ellipse cx="29" cy="${cy + 3}" rx="3.5" ry="2" fill="#f2a58c" opacity=".7"/><ellipse cx="55" cy="${cy + 3}" rx="3.5" ry="2" fill="#f2a58c" opacity=".7"/>
            ${mouth}${sweat}
            <rect x="24" y="${cy + 23}" width="36" height="14" rx="7" fill="var(--bg)"/>
            <text x="42" y="${cy + 33}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--fg)" font-family="Segoe UI, sans-serif">${tag}</text>
          </svg>
          ${open ? `<div class="card sign panel">${list()}</div>` : ''}
        </div>`;
    },

    // 4. Rings: one gauge per limit, always visible.
    rings: () => {
      const b = bars().slice(0, 3);
      const ring = (x, i) => {
        const C = 2 * Math.PI * 17, p = clamp(x.pct);
        return `<div class="ring"><svg width="44" height="44" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="17" fill="none" stroke="var(--soft)" stroke-width="5"/>
            <circle cx="22" cy="22" r="17" fill="none" stroke="${color(x.pct)}" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="${(C * p / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 22 22)"/>
            <text x="22" y="26" text-anchor="middle">${r(x.pct)}%</text></svg>${esc(short(x, i))}</div>`;
      };
      const top = b.length ? b.map(ring).join('') : `<div class="ringmsg">${spark(14)}${summary()}</div>`;
      return `<div class="card rings ${open ? 'open' : ''}"><div class="ringrow" data-toggle>${top}</div>${open ? `<div class="panel">${list()}</div>` : ''}</div>`;
    },

    // 5. Battery: how much of the session is LEFT, like a phone battery.
    battery: () => {
      const s = bars()[0], left = s ? 100 - clamp(s.pct) : 0;
      const fill = left <= 10 ? 'var(--red)' : left <= 25 ? 'var(--amber)' : '#22c55e';
      return `
        <div class="card batt ${open ? 'open' : ''}">
          <div class="head" data-toggle title="${esc(summary())}">
            ${spark(14)}
            <div class="cell"><i style="width:${s ? left : 0}%;background:${fill}"></i><span>${s ? r(left) + '%' : login() ? '!' : '…'}</span></div>
            <span class="lbl">${login() ? 'sign in' : 'left'}</span>
          </div>
          ${open ? `<div class="panel">${list()}</div>` : ''}
        </div>`;
    },

    // 6. Terminal: monospace status line for the command-line crowd.
    terminal: () => {
      const b = bars();
      const blocks = (p, n) => '█'.repeat(Math.round(clamp(p) / 100 * n)) + '░'.repeat(n - Math.round(clamp(p) / 100 * n));
      const tone = (p) => p >= 90 ? 'hot' : p >= 75 ? 'warn' : '';
      const line = login() ? `<span class="warn">✗ not signed in</span> <span class="dimt">— click</span>`
        : b.length >= 2 ? `<span class="dimt">❯</span> claude <span class="${tone(b[0].pct)}">5h ${blocks(b[0].pct, 6)} ${r(b[0].pct)}%</span> <span class="dimt">│</span> <span class="${tone(b[1].pct)}">7d ${blocks(b[1].pct, 6)} ${r(b[1].pct)}%</span>`
        : `<span class="dimt">❯ claude ${state.status === 'error' ? 'error' : 'loading…'}</span>`;
      let more = '';
      if (open && !login()) {
        const rows = b.map((x, i) => {
          const name = short(x, i).toLowerCase().padEnd(8), pct = (r(x.pct) + '%').padStart(4);
          return `<span class="${tone(x.pct)}">${esc(name)} [${blocks(x.pct, 16)}] ${pct}</span>  <span class="dimt">↻ ${esc(resetText(x, true))}</span>`;
        }).join('\n');
        const upd = state.status === 'error' ? esc(state.message) : state.updated ? 'updated ' + time(new Date(state.updated)) : '';
        more = `<div class="lines panel">${rows}\n<span class="dimt">$ ${upd}</span>  <button data-act="refresh">[refresh]</button></div>`;
      }
      return `<div class="term"><div data-toggle>${line}</div>${more}</div>`;
    },

    // ----- Hanging from the top -----

    // 7. Sleepy bat: hangs by its feet; spreads its wings in alarm above 80%.
    bat: () => {
      const spread = mood() === 'worried';
      const wings = spread
        ? 'M28 24 Q2 16 4 46 Q12 40 16 48 Q20 38 28 46 Z M62 24 Q88 16 86 46 Q78 40 74 48 Q70 38 62 46 Z'
        : 'M28 22 Q10 30 14 52 Q20 46 24 52 Q27 44 31 50 Z M62 22 Q80 30 76 52 Q70 46 66 52 Q63 44 59 50 Z';
      return character(toy(90, 84, `<g class="sway">
        <path d="M40 0 v9 M50 0 v9" stroke="#3a2f5c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="${wings}" fill="#3a2f5c"/>
        <ellipse cx="45" cy="33" rx="18" ry="21" fill="#4b3f72"/>
        <path d="M36 50 L33 61 L42 53 Z M54 50 L57 61 L48 53 Z" fill="#4b3f72"/>
        <ellipse cx="45" cy="35" rx="12" ry="10" fill="#6a5a9a"/>
        ${face(45, 32, 0.95, '#fff4d6', '#c78bd8')}
        ${tag(45, 66)}</g>`));
    },

    // 8. Sloth on a branch: holds on with both arms and sways slowly.
    sloth: () => character(toy(110, 94, `
      <rect x="0" y="3" width="110" height="7" rx="3.5" fill="#7a5532"/>
      <ellipse cx="14" cy="4" rx="7" ry="3.5" fill="#5aa469"/><ellipse cx="96" cy="5" rx="8" ry="3.5" fill="#5aa469" transform="rotate(-15 96 5)"/>
      <g class="sway">
        <path d="M40 8 Q34 24 42 38 M70 8 Q76 24 68 38" stroke="#8b6b4a" stroke-width="8" fill="none" stroke-linecap="round"/>
        <path d="M37 6 l2 5 M41 6 l1 5 M69 6 l-1 5 M73 6 l-2 5" stroke="#f3e6cf" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="55" cy="52" rx="23" ry="21" fill="#9c7b5b"/>
        <ellipse cx="55" cy="51" rx="16" ry="12" fill="#ead8bd"/>
        <ellipse cx="50" cy="49" rx="5" ry="3.6" fill="#6b4c36" transform="rotate(-20 50 49)"/>
        <ellipse cx="60" cy="49" rx="5" ry="3.6" fill="#6b4c36" transform="rotate(20 60 49)"/>
        ${face(55, 49, 0.85, '#120c08', '')}
        ${tag(55, 77)}
      </g>`)),

    // 9. Yo-yo: spins on its string, which gets longer as the week fills up. Color follows the session.
    yoyo: () => {
      const b = bars(), week = b[1] ? clamp(b[1].pct) : 0, s = b[0];
      const cy = 36 + Math.round(week * 0.5), c = s ? color(s.pct) : '#6b7280';
      return character(toy(80, cy + 40, `
        <line x1="40" y1="0" x2="40" y2="${cy}" stroke="#d6d3cc" stroke-width="1.2"/>
        <g class="spin">
          <circle cx="40" cy="${cy}" r="20" fill="${c}"/>
          <circle cx="40" cy="${cy}" r="14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
          <path d="M40 ${cy - 20} v8 M40 ${cy + 12} v8 M20 ${cy} h8 M52 ${cy} h8" stroke="rgba(0,0,0,.22)" stroke-width="2"/>
          <circle cx="40" cy="${cy}" r="4.5" fill="#f0f0ee"/>
        </g>
        ${tag(40, cy + 24)}`));
    },

    // 10. Paper lantern: glows brighter as the session fills up, turns red and flickers above 80%.
    lantern: () => {
      const s = bars()[0], p = s ? clamp(s.pct) : 0, hot = !login() && worst() >= 80;
      return character(toy(90, 92, `
        <defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd27a" stop-opacity="${(0.3 + p / 160).toFixed(2)}"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>
        <g class="sway">
          <circle cx="45" cy="42" r="40" fill="url(#glow)" class="${hot ? 'flicker' : ''}"/>
          <line x1="45" y1="0" x2="45" y2="14" stroke="#8a8a85" stroke-width="1.2"/>
          <rect x="35" y="13" width="20" height="5" rx="1.5" fill="#3a2a1e"/>
          <ellipse cx="45" cy="42" rx="25" ry="23" fill="${hot ? '#d9413a' : '#e8833a'}"/>
          <ellipse cx="45" cy="42" rx="16" ry="23" fill="none" stroke="rgba(0,0,0,.16)"/>
          <ellipse cx="45" cy="42" rx="7" ry="23" fill="none" stroke="rgba(0,0,0,.16)"/>
          <rect x="35" y="64" width="20" height="5" rx="1.5" fill="#3a2a1e"/>
          <path d="M41 69 v14 M45 69 v17 M49 69 v14" stroke="#e6b34a" stroke-width="1.6" stroke-linecap="round"/>
          <text x="45" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#fff8ec" font-family="Segoe UI, sans-serif">${login() ? '?' : s ? r(s.pct) + '%' : '…'}</text>
        </g>`));
    },

    // ----- Peeking from the side (the window snaps to that screen edge) -----

    // 11. Peeking cat: half a head and one paw poking in from the right edge.
    cat: () => character(toy(84, 98, `<g class="peek">
      <path d="M50 24 L54 4 L68 18 Z" fill="#9aa0ad"/><path d="M54 19 L55.5 9 L63 17 Z" fill="#f3b7c2"/>
      <path d="M74 16 L86 0 L92 20 Z" fill="#9aa0ad"/>
      <circle cx="76" cy="46" r="30" fill="#9aa0ad"/>
      <path d="M62 22 q4 6 2 12 M70 18 q2 6 0 12" stroke="#7c8291" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M50 50 h-14 M50 54 l-13 4 M50 46 l-13 -4" stroke="#d9dce3" stroke-width="1" stroke-linecap="round"/>
      ${face(63, 46, 1, INK, '#f3b7c2')}
      <ellipse cx="66" cy="80" rx="11" ry="7" fill="#aeb3bf"/><path d="M62 76 v6 M67 75 v7" stroke="#8a8f9c" stroke-width="1.2"/>
      </g>${tag(28, 80)}`)),

    // 12. Octopus: peeks in from the right edge, waving its tentacles.
    octopus: () => character(toy(92, 100, `<g class="bob">
      <g class="wave"><path d="M64 56 q-14 6 -20 18 q-4 8 4 10 M72 60 q-10 10 -10 24 q0 6 6 4 M82 60 q-4 12 0 24 q2 6 6 2 M90 58 q2 10 8 18" stroke="#b05a9c" stroke-width="7" fill="none" stroke-linecap="round"/></g>
      <ellipse cx="74" cy="36" rx="26" ry="25" fill="#c86bb0"/>
      <circle cx="84" cy="20" r="3" fill="#dc8fca"/><circle cx="90" cy="32" r="2.2" fill="#dc8fca"/><circle cx="70" cy="16" r="2" fill="#dc8fca"/>
      ${face(63, 38, 1, INK, '#f7a8d8')}
      </g>${tag(24, 84)}`)),

    // 13. Shy ghost: floats in from the left edge.
    ghost: () => character(toy(72, 102, `<g class="bob">
      <path d="M-12 74 V36 A26 26 0 0 1 40 36 V74 Q34 68 28 74 Q22 80 16 74 Q10 68 4 74 Q-2 80 -8 74 Z" fill="#eef1f6" stroke="rgba(0,0,0,.08)"/>
      <ellipse cx="44" cy="52" rx="6" ry="4" fill="#eef1f6" transform="rotate(-25 44 52)"/>
      ${face(20, 38, 1, INK, '#f7b6c8')}
      </g>${tag(30, 86)}`)),

    // ----- Sitting on the bottom of the screen -----

    // 14. Cactus: flowers when you're fine, droops its arms above 80%.
    cactus: () => {
      const m = mood(), droop = m === 'worried';
      const arms = droop ? 'M38 58 h-7 a6 6 0 0 0 -6 6 v9 M62 54 h7 a6 6 0 0 1 6 6 v8' : 'M38 66 h-7 a6 6 0 0 1 -6 -6 v-11 M62 60 h7 a6 6 0 0 0 6 -6 v-9';
      const petals = [0, 72, 144, 216, 288].map((d) => `<circle cx="${f(50 + 4.5 * Math.cos((d - 90) * Math.PI / 180))}" cy="${f(29 + 4.5 * Math.sin((d - 90) * Math.PI / 180))}" r="3.6" fill="#f472b6"/>`).join('');
      const top = m === 'happy' ? `${petals}<circle cx="50" cy="29" r="2.6" fill="#fde047"/>`
        : m === 'meh' ? `<ellipse cx="50" cy="30" rx="3" ry="4.5" fill="#f9a8d4"/>` : '';
      return character(toy(100, 116, `
        <g class="wobble">
          <path d="${arms}" stroke="#4f9a5f" stroke-width="9" fill="none" stroke-linecap="round"/>
          <rect x="36" y="32" width="28" height="60" rx="14" fill="#5aa469"/>
          <path d="M44 40 v6 M57 42 v6 M50 72 v6 M42 80 v5 M58 78 v5" stroke="#3f7d4c" stroke-width="1.2" stroke-linecap="round"/>
          ${top}
          ${face(50, 56, 1, INK, '#f2a58c')}
        </g>
        <rect x="27" y="88" width="46" height="8" rx="2" fill="#d97a4f"/>
        <path d="M31 96 L35 116 L65 116 L69 96 Z" fill="#c8693f"/>
        <text x="50" y="110" text-anchor="middle" font-size="10" font-weight="700" fill="#fff4ea" font-family="Segoe UI, sans-serif">${sessionText()}</text>`));
    },

    // 15. Robot: the antenna lamp goes green, amber, red; the chest screen shows the session.
    robot: () => {
      const w = worst(), lamp = login() ? '#6b7280' : w >= 90 ? '#ef4444' : w >= 75 ? '#f59e0b' : '#34d399';
      return character(toy(100, 108, `
        <line x1="50" y1="9" x2="50" y2="20" stroke="#8796ad" stroke-width="2"/>
        <circle cx="50" cy="7" r="4.5" fill="${lamp}" class="blink"/>
        <rect x="29" y="20" width="42" height="31" rx="9" fill="#c3cede"/>
        <rect x="34" y="27" width="32" height="18" rx="7" fill="#1f2a3a"/>
        ${face(50, 34, 0.8, '#7fe3ff', '')}
        <rect x="45" y="51" width="10" height="4" fill="#8796ad"/>
        <path d="M28 62 l-9 12" stroke="#a9b7cc" stroke-width="6" stroke-linecap="round"/>
        <path class="armwave" d="M72 62 l10 -8" stroke="#a9b7cc" stroke-width="6" stroke-linecap="round"/>
        <rect x="27" y="55" width="46" height="34" rx="9" fill="#a9b7cc"/>
        <rect x="34" y="61" width="32" height="16" rx="4" fill="#1f2a3a"/>
        <text x="50" y="73" text-anchor="middle" font-size="10" font-weight="700" fill="${lamp}" font-family="Consolas, Menlo, monospace">${sessionText()}</text>
        <rect x="35" y="89" width="11" height="12" rx="2" fill="#8796ad"/><rect x="54" y="89" width="11" height="12" rx="2" fill="#8796ad"/>
        <rect x="31" y="100" width="17" height="6" rx="3" fill="#6b7a91"/><rect x="52" y="100" width="17" height="6" rx="3" fill="#6b7a91"/>`));
    },

    // 16. Fish bowl: the water is the session you have LEFT, and it drains as you use it.
    fishbowl: () => {
      const s = bars()[0], left = s ? 100 - clamp(s.pct) : 60, worried = mood() === 'worried';
      const top = Math.round(96 - 66 * left / 100), fy = Math.max(top + 9, 64);
      return character(toy(100, 112, `
        <defs><clipPath id="bowl"><circle cx="50" cy="60" r="37"/></clipPath></defs>
        <circle cx="50" cy="60" r="38" fill="rgba(170,210,235,.10)"/>
        <g clip-path="url(#bowl)">
          <rect x="0" y="${top}" width="100" height="${100 - top}" fill="#3b82f6" opacity=".38"/>
          <path d="M0 ${top} q12 -3 25 0 t25 0 t25 0 t25 0" stroke="#8cc4ff" stroke-width="1.2" fill="none"/>
          <ellipse cx="50" cy="96" rx="30" ry="6" fill="#d9c08a" opacity=".7"/>
          <path d="M38 96 q-3 -10 2 -18 M62 96 q4 -9 -1 -15" stroke="#4f9a5f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <g class="swim">
            <path d="M40 ${fy} l-7 -5 v10 z" fill="#f08a3c"/>
            <ellipse cx="50" cy="${fy}" rx="10" ry="6.5" fill="#f59e0b"/>
            <circle cx="54.5" cy="${fy - 1.5}" r="1.4" fill="${INK}"/>
            <path d="${worried ? `M56.5 ${fy + 3} q1.5 -1.6 3 0` : `M56.5 ${fy + 2} q1.5 1.6 3 0`}" stroke="${INK}" stroke-width="1" fill="none" stroke-linecap="round"/>
          </g>
          <g class="rise"><circle cx="60" cy="${fy - 8}" r="1.8" fill="none" stroke="#bfe0ff"/><circle cx="62" cy="${fy - 14}" r="1.2" fill="none" stroke="#bfe0ff"/></g>
        </g>
        <circle cx="50" cy="60" r="38" fill="none" stroke="#b9d7ea" stroke-width="2"/>
        <ellipse cx="50" cy="23.5" rx="20" ry="3.5" fill="rgba(0,0,0,.25)" stroke="#b9d7ea" stroke-width="2"/>
        <path d="M30 40 q-6 10 -4 22" stroke="rgba(255,255,255,.35)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="22" y="97" width="56" height="13" rx="4" fill="#6b4f3a"/>
        <text x="50" y="107" text-anchor="middle" font-size="9.5" font-weight="600" fill="#f5e6d3" font-family="Segoe UI, sans-serif">${login() ? 'sign in' : s ? r(left) + '% left' : '…'}</text>`));
    },
  };

  // ---------- render + size the window to fit ----------
  function render() {
    const d = dockOf(layout), a = open ? null : currentAlert();
    root.innerHTML = `<div class="wrap ${d} ${a ? 'alerting' : ''}">${(layouts[layout] || layouts.pill)()}${a ? bubble(a) : ''}</div>`;
    // Demo inside the gallery's frames: sit against the same edge the app would use.
    if (window.widget.demo && window.self !== window.top) {
      root.style.cssText = { right: 'left:auto;right:0', left: '', bottom: 'top:auto;bottom:0;left:50%;transform:translateX(-50%)' }[d] ?? 'left:50%;transform:translateX(-50%)';
    }
    requestAnimationFrame(() => {
      const b = root.getBoundingClientRect();
      window.widget.setSize(Math.ceil(b.width), Math.ceil(b.height), d);
    });
  }

  function toggle() {
    if (login()) return window.widget.login();
    open = !open;
    render();
  }

  // Click a layout's handle to toggle; drag anywhere to move the widget.
  let drag = null;
  root.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('button')) return;
    root.setPointerCapture(e.pointerId);
    drag = { sx: e.screenX, sy: e.screenY, wx: window.screenX, wy: window.screenY, moved: false, handle: !!e.target.closest('[data-toggle]') };
  });
  root.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.sx, dy = e.screenY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    if (drag.moved) window.widget.move(drag.wx + dx, drag.wy + dy);
  });
  root.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) window.widget.moved(); else if (d.handle) toggle();
  });
  // Buttons: alert actions are handled here, everything else goes to the main process.
  const actions = {
    dismiss: () => { dismissAlert(); render(); },
    details: () => { open = true; render(); },
  };
  root.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const name = act.dataset.act;
    if (actions[name]) actions[name](); else window.widget[name]();
  });
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); window.widget.menu(); });

  window.widget.onConfig((c) => { layout = c.layout; open = !!c.open; alertsOn = c.alerts !== false; render(); });
  window.widget.onState((s) => {
    state = s;
    if (login()) open = false;
    render();
  });
  render();
</script>
</body>
</html>
